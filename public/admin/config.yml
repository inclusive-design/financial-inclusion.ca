backend:
  name: github
  branch: main
  repo: inclusivedesign/financial-inclusion.ca
  base_url: https://auth.incd.ca
  commit_messages:
    create: 'chore(cms): create "{{path}}"'
    update: 'chore(cms): update "{{path}}"'
    delete: 'chore(cms): delete "{{path}}"'
    uploadMedia: 'chore(cms): upload "{{path}}"'
    deleteMedia: 'chore(cms): delete "{{path}}"'
media_folder: src/assets/uploads
public_folder: /assets/uploads
logo:
  src: /icon.svg
  show_in_header: false
app_title: FIRM CMS

output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

i18n:
  locales: [en, fr]
  default_locale: en
  initial_locales: [en]
  canonical_slug:
    key: id

collections:
  - label: Pages
    label_singular: Page
    name: page
    icon: draft
    i18n:
      structure: multiple_folders
      omit_default_locale_from_file_path: true
    folder: src/collections/pages
    reorder: true
    nested:
      depth: 3
      summary: '{{title}}'
      subfolders: true
    meta: { path: { index_file: index } }
    slug: "{{fields._slug | localize}}"
    preview_path: '/{{dirname}}/'
    filter: { field: id, pattern: '^(?!(index|404)$).+$' }
    extension: md
    create: true
    sortable_fields:
      fields: [title, order]
      default:
        field: order
        direction: ascending
    fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Navigation Order,
        name: order
        widget: number
        min: 0
        i18n: duplicate
      - label: Excerpt
        name: excerpt
        widget: string
        required: false
        i18n: true
      - label: Body
        name: body
        widget: markdown
        i18n: true

singletons:
  - label: Site Configuration
    name: site
    icon: settings
    editor:
      preview: false
    file: src/_data/site.json
    i18n: true
    fields:
      - label: Name
        name: name
        widget: string
        i18n: true
      - label: Description
        name: description
        widget: text
        i18n: true
      - label: Author Name
        name: authorName
        widget: string
        i18n: true
      - label: Author Email
        name: authorEmail
        widget: string
        i18n: duplicate
      - label: Author Website
        name: authorWebsite
        widget: string
        i18n: duplicate
      - label: Canonical URL
        name: url
        widget: string
        i18n: duplicate
      - label: Supported Languages
        label_singular: Supported Language
        name: languages
        widget: list
        i18n: duplicate
        fields:
          - label: Name
            name: name
            widget: string
            i18n: true
          - label: Code
            name: code
            widget: string
            i18n: duplicate
          - label: Direction
            name: direction
            widget: select
            options:
              - label: Left to Right
                value: ltr
              - label: Right to Left
                value: rtl
            i18n: duplicate
  - label: Translations
    label_singular: Translation
    name: translations
    icon: translate
    editor:
      preview: false
    i18n:
      initial_locales: all
    file: src/_data/translations.json
    fields:
      - label: Translations
        name: translations
        widget: keyvalue
        root: true
        i18n: true
