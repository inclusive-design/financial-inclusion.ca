name: Lint
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: lts
          cache: true
      - name: Lint files
        run: |
          deno task lint
